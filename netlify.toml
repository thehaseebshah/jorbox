[build]
  publish = "dist"
  command = "npm install && npm run build"

[build.environment]
  dgEnableSearch = "true"
  dgShowFileTree = "false"
  dgShowToc = "false"
  dgShowBacklinks = "false"
  dgShowLocalGraph = "false"
  dgLinkPreview = "true"
  dgShowTags = "true"
  dgShowInlineTitle = "false"
  dgHomeLink = "true"
  SITE_NAME_HEADER = "Shabab"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Digital Garden uses the vault folder in copied Docs URLs, while note permalinks are flattened.
[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
